<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f3b1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rata & Smudge">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Rata &amp; Smudge</title>
<style>
:root{
  /* Rata & Smudge brand, taken from the logo on rataandsmudge.co.nz: deep olive lettering, sage sprig,
     lavender buds, warm off-white. Cinzel is the closest free match to the logo's classical capitals. */
  --green:#2f3b1f; --green2:#6b703e; --lav:#806092; --cream:#f7f5ee; --card:#fffefa; --ink:#2b2c22; --muted:#686a5a; --line:#e5e1d2;
  --rata:#b8322a; --honey:#c98a3b; --ok:#3f6a2a; --warn:#a86a12; --danger:#b8322a;
  --brand-font:"Cinzel",Georgia,"Times New Roman",serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
@font-face{font-family:"Cinzel";src:url("fonts/cinzel-600.woff2") format("woff2");font-weight:400 700;font-display:swap}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.top h1,.gcard h1,.tile h2,.card h3,.modal h2,.coming h2{font-family:var(--brand-font);font-weight:600;letter-spacing:.02em}
html,body{margin:0;height:100%;background:var(--cream);color:var(--ink);font:18px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
/* Safari zooms into any text box under 16px: keep every input at 18px */
input,select,textarea{font:inherit;font-size:18px;color:var(--ink);-webkit-user-select:text;user-select:text}
.txt{width:100%;padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:#fff;min-height:56px}
.txt:focus{outline:none;border-color:var(--green2)}
[hidden]{display:none!important}
a{color:var(--green)}

/* ---------- top bar (never scrolls away) ---------- */
.top{position:fixed;left:0;right:0;top:0;z-index:20;background:var(--green);color:#fff;
  padding:calc(10px + var(--sat)) calc(16px + var(--sar)) 10px calc(16px + var(--sal));display:flex;align-items:center;gap:12px;min-height:calc(72px + var(--sat))}
.top .back{background:rgba(255,255,255,.16);border-radius:14px;padding:10px 18px 10px 12px;font-weight:700;font-size:19px;min-height:52px;display:flex;align-items:center;gap:4px}
.top .back b{font-size:28px;line-height:1;margin-top:-3px}
.top .title{flex:1;min-width:0}
.top .title h1{margin:0;font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .title small{display:block;opacity:.85;font-size:15px}
.syncpill{border-radius:99px;padding:8px 14px;font-size:15px;font-weight:700;background:rgba(255,255,255,.16);white-space:nowrap}
.syncpill.wait{background:#ffe2a8;color:#5b3c00}
.top .cog{font-size:26px;width:56px;height:56px;border-radius:14px;background:rgba(255,255,255,.16)}
main{padding:calc(88px + var(--sat)) calc(18px + var(--sar)) calc(28px + var(--sab)) calc(18px + var(--sal));max-width:1180px;margin:0 auto}

.loyal{background:#eef4e8;border:2px solid #cfe0c2;border-radius:16px;padding:14px;margin-top:14px}
.loyal p{margin:6px 0}
.ctabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}

/* ---------- calendar (works like Family Screen's) ---------- */
.rcal{position:fixed;left:0;right:0;bottom:0;max-width:1180px;margin:0 auto;padding:8px calc(10px + var(--sar)) 0 calc(10px + var(--sal));display:flex;flex-direction:column;overflow:hidden;background:var(--cream);z-index:5}
body:has(.rcal) main{min-height:0}
.pc-head{display:flex;align-items:center;gap:6px;padding:4px 2px 8px;flex:none;position:relative;z-index:5;background:var(--cream)}
.pc-head h2{margin:0;font-family:var(--brand-font);font-weight:600;font-size:24px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-head>button{flex:none;background:var(--card);border-radius:12px;min-width:44px;height:44px;font-size:22px;box-shadow:0 1px 0 var(--line)}
.pc-head .pc-today{border:2px solid var(--green);font-weight:800;font-size:17px;color:var(--green)}
.pv-seg{display:flex;background:#ece7da;border-radius:12px;padding:3px;gap:2px;flex:none}
.pv-seg button{height:38px;padding:0 12px;font-size:15px;font-weight:700;border-radius:9px;color:var(--muted)}
.pv-seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pc-dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:13px;font-weight:700;color:var(--muted);padding-bottom:6px;transition:opacity .2s;flex:none}
.pc-dow span:last-child{color:var(--rata)}
.pc-gridwrap{overflow:hidden;touch-action:none;flex:none}
.pc-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:58px}
.pc-cell{background:#fff;border-radius:10px;margin:1.5px;padding:3px 2px 4px;text-align:center;min-width:0;overflow:hidden;border:2px solid transparent;display:flex;flex-direction:column;gap:2px}
.pc-cell.other{opacity:.4}
.pc-cell.sel{border-color:var(--green2)}
.pc-cell .n{font-size:16px;font-weight:700;align-self:center;min-width:26px;height:26px;line-height:26px;border-radius:8px;flex:none}
.pc-cell.ctoday .n{background:var(--green);color:#fff}
.pc-cell.sun .n{color:var(--rata)}.pc-cell.ctoday.sun .n{color:#fff}
.pc-cell .lines{display:flex;flex-direction:column;gap:2px}
.pc-cell .ln{height:5px;border-radius:3px;margin:0 2px}
.pc-cell .titles{display:none;flex-direction:column;gap:2px}
.pc-grid.titles .pc-cell .titles{display:flex}.pc-grid.titles .pc-cell .lines{display:none}
.pc-cell .tt{font-size:12px;line-height:1.25;border-radius:4px;padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.pc-cell .more{font-size:11px;color:var(--muted);text-align:left;padding-left:3px}
.dim{opacity:.42;filter:grayscale(.7)}
.done b{text-decoration:line-through;opacity:.7}
.pc-sheet{position:absolute;left:0;right:0;bottom:0;background:var(--cream);border-radius:22px 22px 0 0;box-shadow:0 -6px 20px rgba(43,44,34,.10);display:flex;flex-direction:column;z-index:3;padding:0 calc(10px + var(--sar)) 0 calc(10px + var(--sal))}
.pc-grab{align-self:center;width:90px;height:22px;display:grid;place-items:center;cursor:ns-resize;touch-action:none;flex:none}
.pc-grab:before{content:"";width:44px;height:5px;border-radius:9px;background:#c9c3b2}
.ps-head{display:flex;align-items:baseline;gap:8px;padding:0 6px 8px;touch-action:none;flex:none}
.ps-head b{font-size:38px;line-height:1;font-family:var(--brand-font)}
.ps-head span{font-size:16px;font-weight:800;color:var(--muted);text-transform:uppercase}
.ps-head .ps-mon{margin-right:auto}
.ps-head button{background:var(--card);border-radius:12px;width:46px;height:46px;font-size:22px;align-self:center;box-shadow:0 1px 0 var(--line)}
.ps-allday{display:flex;flex-direction:column;gap:6px;padding:0 4px 8px;flex:none;max-height:32%;overflow:auto}
.ad{border-radius:14px;padding:9px 12px;text-align:left;width:100%}
.ad b{display:block;font-size:17px;font-weight:600}
.ad small{display:block;font-size:13px;opacity:.75}
.ps-scroll{flex:1;overflow-y:auto;padding:0 4px calc(110px + var(--sab));overscroll-behavior:contain}
.tl{position:relative;margin-top:8px}
.tl-h{position:absolute;left:0;right:0;height:58px;border-top:1px solid var(--line)}
.tl-h span{position:absolute;left:0;top:-9px;width:48px;text-align:right;font-size:12px;font-weight:700;color:var(--muted);background:var(--cream);padding-right:4px}
.tb{position:absolute;border-radius:10px;padding:4px 8px;text-align:left;overflow:hidden;color:var(--ink);box-shadow:inset 0 0 0 1px rgba(255,255,255,.6);display:flex;flex-direction:column;gap:1px;margin-left:2px}
.tb b{font-size:15px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb small{font-size:12px;opacity:.8;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb.short{flex-direction:row;align-items:center;gap:6px}.tb.short small{display:none}
.tl-now{position:absolute;left:52px;right:0;height:2px;background:var(--rata);z-index:2;pointer-events:none}
.tl-now:before{content:"";position:absolute;left:-6px;top:-5px;width:12px;height:12px;border-radius:50%;background:var(--rata)}
.tl-now span{position:absolute;left:-54px;top:-9px;font-size:11px;font-weight:800;color:var(--rata);background:var(--cream);padding:0 2px}
.pw-top{display:flex;flex-direction:column;min-height:0;overflow:hidden;touch-action:pan-y}.pw-days{touch-action:pan-y}
.pw-days,.pw-all{display:grid;grid-template-columns:30px repeat(7,minmax(0,1fr));gap:2px;flex:none}
.pw-d{display:flex;flex-direction:column;align-items:center;padding:2px 0 6px;border-radius:12px}
.pw-d small{font-size:12px;font-weight:700;color:var(--muted)}
.pw-d b{font-size:18px;width:34px;height:34px;line-height:34px;border-radius:50%}
.pw-d.ctoday b{background:var(--green);color:#fff}.pw-d.sel b{outline:2px solid var(--green2)}
.pw-all{padding-bottom:4px;border-bottom:1px solid var(--line)}
.pw-all>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.pw-a,.pw-more{font-size:11px;font-weight:700;border-radius:6px;padding:2px 3px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.pw-more{color:var(--muted);text-align:center}
.pw-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:90px}
.pw-grid{position:relative;margin-top:8px}
.pw-h{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.pw-h span{position:absolute;left:0;top:-8px;width:26px;text-align:right;font-size:11px;font-weight:700;color:var(--muted);background:var(--cream);padding-right:2px}
.pw-cols{position:absolute;left:32px;right:0;top:0;bottom:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.pw-col{position:relative;border-left:1px solid #ebe5d4}
.pw-col.ctoday{background:rgba(107,112,62,.08)}.pw-col.sel{background:rgba(43,44,34,.04)}
.pw-b{position:absolute;border-radius:6px;padding:2px 3px;font-size:11px;line-height:1.15;font-weight:700;text-align:left;overflow:hidden;word-break:break-word;color:var(--ink)}
.pw-now{position:absolute;left:-2px;right:0;height:2px;background:var(--rata);z-index:2;pointer-events:none}
.cal-fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + var(--sab));z-index:30;background:var(--green);color:#fff;border-radius:999px;box-shadow:0 10px 30px rgba(43,44,34,.28);display:flex;align-items:center;gap:12px;padding:12px 16px 12px 22px;font-weight:700;font-size:18px;min-height:60px}
.cal-fab b{font-size:30px;font-weight:500;line-height:.8}
.slideL{animation:slL .22s ease}.slideR{animation:slR .22s ease}
@keyframes slL{from{transform:translateX(28px);opacity:.4}to{transform:none;opacity:1}}@keyframes slR{from{transform:translateX(-28px);opacity:.4}to{transform:none;opacity:1}}
.addbar{display:flex;gap:10px}.addbar .txt{flex:1;min-width:0}.addbar .btn{flex:none}
.lrow{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line);min-height:64px}
.lrow:first-of-type{border-top:0}
.tick{width:44px;height:44px;border-radius:12px;border:2.5px solid var(--green2);flex:none;font-size:24px;font-weight:800;color:#fff;display:grid;place-items:center}
.tick.on{background:var(--green);border-color:var(--green)}
.lrow .grow{flex:1}.ltxt{text-align:left;min-width:0}.ltxt b{display:block;font-weight:600;overflow-wrap:anywhere}.ltxt small{display:block;color:var(--muted);font-size:15px}
.isdone .ltxt b{text-decoration:line-through;color:var(--muted)}
.vbar{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:16px}
.vtalk,.vdrive{min-height:84px;border-radius:22px;font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 1px 0 var(--line)}
.vtalk{background:var(--rata);color:#fff}.vtalk span{font-size:34px}.vtalk small{font-size:14px;background:#fff;color:var(--rata);border-radius:99px;padding:3px 10px}
.vdrive{background:var(--card);color:var(--ink);font-size:20px;flex-direction:column;gap:2px}.vdrive .vlbl{font-size:14px;font-weight:700;color:var(--muted)}
.vrec{text-align:center;padding:10px 0}
.vdot{width:120px;height:120px;border-radius:50%;margin:6px auto 14px;display:grid;place-items:center;font-size:56px;background:#efe7d6}
.vdot.on{background:#f6d4cf;animation:vpulse 1.2s ease-in-out infinite}.vdot.work{animation:vpulse 1.6s ease-in-out infinite}
@keyframes vpulse{50%{transform:scale(1.08)}}
.vdone{width:100%;min-height:76px;font-size:26px}
.heard{font-style:italic;background:#f3efe4;border-radius:14px;padding:10px 14px}
.draft h3{font-size:19px}.draft.settled{opacity:.7}
.txt.unsure{background:#fff6c9;border-color:#e2c44d}
.note.clash{color:var(--danger);font-weight:700}
.bad,small.bad,b.bad{color:var(--danger)!important;font-weight:700}
.attncard{border:2px solid var(--danger)}
.lrow.attn{align-items:flex-start}.lrow.attn small{display:block;margin-top:2px}.fixes{display:flex;flex-direction:column;gap:6px}
.unitin{display:flex;align-items:center;gap:8px}.unitin .txt{flex:1}.unitin .u{font-weight:700;min-width:44px}
.switch{flex:none;width:64px;height:38px;border-radius:99px;background:#d9d2c2;border:0;position:relative;padding:0;cursor:pointer}.switch i{position:absolute;left:4px;top:4px;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:left .15s}.switch.on{background:var(--green)}.switch.on i{left:30px}
.prodrow{gap:12px}.prodrow.offtill .grow b{text-decoration:line-through;color:var(--muted)}.prodrow.offtill{opacity:.75}
.findlist .frow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 6px;border:0;border-bottom:1px solid var(--line);background:none;font:inherit;min-height:56px;cursor:pointer}.findlist .frow.off{color:var(--muted)}.findlist .frow.off b{text-decoration:line-through}.findlist .frow small{display:block}
.freebox{border-radius:14px;padding:12px 14px;border:2px solid}.freebox.red{background:#fbe4e1;border-color:var(--danger);color:var(--danger)}.freebox.green{background:#e3efdb;border-color:var(--ok);color:var(--ok)}
.practicebar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#806092;color:#fff;font-weight:800;font-size:16px;padding:12px 16px calc(12px + var(--sab));text-align:center;width:100%}
body.practicing #main{padding-bottom:80px}
.homesearch{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;margin:4px 0 14px;padding:0 18px;border-radius:16px;background:#fff;border:2px solid var(--line);font-size:19px;color:var(--muted);text-align:left}
.vsteps{list-style:none;padding:0;margin:8px auto 10px;max-width:360px;text-align:left}.vsteps li{padding:7px 0;font-size:18px;color:var(--muted)}.vsteps li.done{color:var(--ok);font-weight:700}.vsteps li.now{color:var(--ink);font-weight:800}
.notebanner{position:fixed;left:50%;transform:translateX(-50%);top:calc(84px + var(--sat));z-index:70;background:var(--rata);color:#fff;font-weight:800;font-size:17px;border-radius:99px;padding:14px 22px;box-shadow:0 10px 30px rgba(43,44,34,.3)}
.vreply small{display:block;margin:2px 0 8px}.vreply .vrow{display:flex;gap:8px}.vreply .vrow .txt{flex:1}
.answer{font-size:20px;line-height:1.4;background:#eef3e6;border-radius:14px;padding:12px 16px}
.vbar.three{grid-template-columns:2fr 1fr 1fr 1fr}
.helpcard{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin:0 0 12px}.helpcard h3{margin:0 0 6px}.helpcard p{margin:0 0 10px;font-size:18px}
.steps{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 12px}.stepchip{background:var(--sand,#efe9da);border-radius:10px;padding:6px 10px;font-weight:700;font-size:16px}.steps .arrow{color:var(--muted);font-weight:800}
.tickrow{display:flex;align-items:center;gap:10px;margin:10px 0;cursor:pointer}.tickrow input{width:26px;height:26px;flex:none}
.drive{display:flex;flex-direction:column;gap:16px;padding-top:6px}
.dbtn{min-height:120px;border-radius:26px;font-size:34px;font-weight:800;color:#fff;width:100%}
.dbtn.talk{background:var(--rata);min-height:200px;font-size:46px}.dbtn.today{background:var(--green)}.dbtn.next{background:var(--green)}
.dbtn.yes{background:#2f7d32}.dbtn.later{background:#a06a12}.dbtn.stop{background:#55574a;min-height:90px;font-size:28px}
.dnow{background:var(--card);border-radius:22px;padding:18px 20px;text-align:center}.dnow small{color:var(--muted);font-weight:700}.dnow b{display:block;font-size:30px;margin:6px 0}.dnow span{color:var(--muted);font-size:18px}
.pill{flex:none;border-radius:99px;padding:5px 12px;font-weight:700;font-size:15px}.pill.bad{background:#fbe4e1;color:var(--danger)}.pill.ok{background:#e3efdb;color:var(--ok)}
.txt.qty{width:96px;flex:none;text-align:center}.unit{flex:none;color:var(--muted);min-width:34px}
.stockhead,.stockrow{display:grid;grid-template-columns:1fr 110px 110px;gap:8px;align-items:center}
.stockhead{font-size:14px;color:var(--muted);padding-bottom:6px}.stockhead b,.stockrow b{text-align:center}
.stockrow{width:100%;text-align:left;padding:12px 0;border-top:1px solid var(--line);font-size:18px}.stockrow b{font-size:20px}.stockrow b.zero{color:var(--danger)}
.ptile .pout{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.85);color:var(--danger);font-size:12px;font-weight:800;border-radius:99px;padding:2px 8px}
.orow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 0;border-top:1px solid var(--line);min-height:72px}.orow:first-child{border-top:0}
.orow .grow{flex:1;min-width:0}.orow b{display:block;font-weight:600}.orow small{display:block;color:var(--muted);font-size:15px}
.ost{flex:none;border-radius:99px;padding:5px 12px;font-weight:700;font-size:14px;background:#efe7d6}.ost.new{background:#fbe9c9;color:#8a5a0a}.ost.packed{background:#e2ecf7;color:#2a5a8a}.ost.sent{background:#e3efdb;color:var(--ok)}.ost.cancelled{background:#eee;color:#888}
.pqty{flex:none;font-size:22px;min-width:52px}.packslip{background:#fbfaf5}
.rgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
@media (max-width:760px){ .rgrid{grid-template-columns:1fr 1fr} }
.rstat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}.rstat span{display:block;color:var(--muted);font-size:14px;font-weight:600}.rstat b{display:block;font-size:26px;margin:2px 0}.rstat small{color:var(--muted);font-size:13px}
.rbars{display:flex;flex-direction:column;gap:6px}.rbar{display:grid;grid-template-columns:minmax(80px,30%) 1fr auto;gap:10px;align-items:center;font-size:15px}
.rbar .rl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rbar .rt{height:18px;background:#f1ece0;border-radius:6px;overflow:hidden}.rbar .rt i{display:block;height:100%;background:var(--green2);border-radius:6px}.rbar .rv{font-weight:700;min-width:70px;text-align:right}
.ptable{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:17px}.ptable b{text-align:right}.ptable .neg{color:var(--danger)}
.card.nudge{border:2px solid var(--green2)}
.formrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.profbtn{border-color:var(--green2)}.profhead{text-align:center;padding:18px}.profhead span{display:block;font-weight:700;color:var(--muted,#686a5a)}.profhead b{display:block;font-size:40px;font-family:Georgia,serif;color:var(--green);margin:4px 0}.profhead b.neg{color:#b3261e}.profhead small{display:block;margin-top:4px}
.profhead.bad{border:2px solid #e9b4ae}.profhead.mid{border:2px solid #f0d58a}.profhead.good{border:2px solid #b9d3a8}

ol.ideas{margin:0;padding:0;list-style:none;counter-reset:i}ol.ideas li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line,#e5e1d2);counter-increment:i}
ol.ideas li::before{content:counter(i);flex:none;width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;font-weight:800;display:grid;place-items:center}ol.ideas .grow{flex:1;min-width:0}ol.ideas small{display:block;color:var(--muted,#686a5a)}ol.ideas .btn{flex:none}
.clockgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.clockgrid .btn{min-height:72px;font-size:17px;display:flex;flex-direction:column;align-items:center;justify-content:center}.clockgrid small{font-size:12px;font-weight:600;opacity:.85}
.clockbar{border:2px solid var(--green2)}.clockbar.long{border-color:var(--warn);background:#fff4d6}
.formrow.four{grid-template-columns:repeat(4,1fr);gap:6px}.formrow.four .note{font-size:.8rem}@media(max-width:420px){.formrow.four{grid-template-columns:1fr 1fr}}

.prow{width:100%;text-align:left;padding-left:14px}

/* ---------- brand ---------- */
.brand{display:flex;flex-direction:column;align-items:center;margin:0 0 14px}

.gcard img.brandlogo{max-width:100%;max-height:150px;object-fit:contain;mix-blend-mode:multiply}

/* ---------- home ---------- */
.today{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 22px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.tiles .tile.sell{grid-column:span 2}
.tile{background:var(--card);border:1px solid var(--line);border-radius:26px;min-height:190px;padding:22px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 2px 0 rgba(0,0,0,.04);transition:transform .08s}
.tile:active{transform:scale(.98)}
.tile .ic{font-size:52px;line-height:1}

.tile.sell{background:var(--green);color:#fff;border-color:var(--green)} .tile.sell p{color:#e5eee1}

/* ---------- screens and cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px 22px;margin-bottom:16px}

.coming{text-align:center;padding:40px 20px}

/* ---------- products, deals ---------- */
.colours{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- the till: products left, sale right (landscape); sale at the bottom (portrait) ---------- */
.till{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.fchip{display:inline-flex;align-items:center;gap:8px;border-radius:99px;padding:10px 16px;min-height:48px;font-weight:700;font-size:16px;background:#efe9da;border:3px solid transparent}
.fchip i{width:16px;height:16px;border-radius:50%;background:var(--c)}
.fchip small{opacity:.6;font-size:14px}
.fchip.on{background:#fff;border-color:var(--c,var(--green))}
.lk{font-size:13px;opacity:.7}
.corr{background:#fff4d6;color:#5b3c00;padding:10px 14px;font-size:15px;border-bottom:2px solid #f0d58a}
.ptile .ps{font-size:15px;opacity:.9}
.ptile .pp{font-size:24px;font-weight:800;margin-top:6px}
.ptile .pq{position:absolute;top:-8px;right:-8px;background:var(--ink);color:#fff;border-radius:99px;min-width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;padding:0 8px}
.cart{position:sticky;top:calc(84px + var(--sat));background:var(--card);border:2px solid var(--green);border-radius:22px;display:flex;flex-direction:column;max-height:calc(100vh - 110px - var(--sat) - var(--sab));overflow:hidden}
.clines{flex:1;overflow:auto;padding:8px 14px;min-height:80px}
/* landscape: items on top, total and payment at the bottom; the grab handle is for the sliding panel only */
.cart .corr{order:0} .cart .clines{order:1} .cart .ctot{order:2} .cart .pay{order:3}
.grab{display:none}
.qb.rm{background:#fbe4e1;color:var(--danger);font-size:18px;margin-left:4px}
.modal.big .clines{padding:0;overflow:visible}
.cempty{text-align:center;padding:24px 0}
.cl{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.cl small{display:block;color:var(--muted);font-size:14px}
.cl .grow{flex:1;min-width:0}
.cl.deal{color:var(--ok)}
.qb{width:44px;height:44px;border-radius:12px;background:#efe7d6;font-size:24px;font-weight:800}
.qn{min-width:24px;text-align:center}
.la{min-width:76px;text-align:right}
.ctot{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#f3eee3;border-top:2px solid var(--line)}
.ctot b{font-size:38px}
.ctot .tot{display:flex;flex-direction:column;align-items:flex-end;line-height:1.05}
.gstl{font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.ctot span{color:var(--muted);font-size:16px}
.pay{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:12px}
.pb{border-radius:16px;min-height:72px;font-weight:800;font-size:19px;color:#fff}
.pb.cash{background:var(--ok)} .pb.eftpos{background:var(--lav)} .pb.other{background:#6d685d}
.pb:disabled{opacity:.35}
.tbar{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 14px}
.notes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.notes button{min-height:76px;border-radius:16px;background:#e8f1e3;font-size:26px;font-weight:800;color:var(--green)}
.notes .exact{background:var(--green);color:#fff;font-size:22px}
.change{border-radius:16px;padding:14px;font-size:20px;text-align:center;background:#f3eee3}
.change.ok{background:#e3f1e6;color:var(--ok)} .change.bad{background:#fbe4e1;color:var(--danger)}
.change .big{font-size:40px;display:block}
.eod{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.eod div{background:#f3eee3;border-radius:14px;padding:10px 14px} .eod span{display:block;color:var(--muted);font-size:15px} .eod b{font-size:24px}
.row.voided{opacity:.5;text-decoration:line-through}
.tillmode .top{background:#7a4b0b}
.tlock{background:rgba(255,255,255,.18);border-radius:14px;padding:10px 14px;font-weight:700;min-height:52px}
@media (max-width:1000px) and (orientation:portrait),(max-width:860px){
  .till{grid-template-columns:1fr}
  .tgrid{padding-bottom:calc(var(--peek) + 20px + var(--sab))}
  /* the sale slides up from the bottom: closed shows the total and payment buttons, open shows every item */
  :root{--peek:200px}
  .cart{--peek:200px;position:fixed;left:0;right:0;bottom:0;top:auto;height:calc(100% - 84px - var(--sat));max-height:none;border-radius:22px 22px 0 0;border-width:2px 0 0;z-index:15;padding-bottom:var(--sab);box-shadow:0 -8px 30px rgba(0,0,0,.14);
    transform:translateY(calc(100% - var(--peek) - var(--sab)));transition:transform .25s ease;touch-action:none}
  .cart.open{transform:translateY(0)}
  .cart .grab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 4px;cursor:grab;order:0;touch-action:none}
  .cart .grab i{width:56px;height:6px;border-radius:3px;background:#cfc8b6}
  .cart .grab span{font-size:15px;font-weight:700;color:var(--green2)}
  .cart .ctot{order:1;border-top:0;padding:6px 16px} .cart .pay{order:2;padding:4px 12px 10px} .cart .corr{order:3} .cart .clines{order:4;touch-action:pan-y}
  .tbar,.filters{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin-left:-4px;margin-right:-4px;padding:0 4px}

}
@media (max-width:640px){
  .tgrid{grid-template-columns:repeat(2,1fr);gap:10px}
  .ptile{min-height:112px;padding:12px} .ptile .pn{font-size:16px} .ptile .pp{font-size:21px}
  .ctot b{font-size:30px} .pb{min-height:60px;font-size:17px} .bigseg{grid-template-columns:1fr 1fr}
  .cart,:root{--peek:182px} .modal.big{padding:16px} .paybig .btn{min-height:60px;font-size:17px}
  .tbar{gap:8px} .tbar .btn{min-height:48px;padding:8px 12px;font-size:15px}
}

/* ---------- pop-ups ---------- */
#layer:empty{display:none}
.scrim{position:fixed;inset:0;background:rgba(30,28,22,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:calc(16px + var(--sat)) 16px calc(16px + var(--sab))}
.modal{background:var(--card);border-radius:24px;padding:24px;width:min(560px,100%);max-height:100%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h2{margin:0 0 12px;font-size:24px}
.mact{display:flex;gap:12px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.pindots{display:flex;gap:16px;justify-content:center;margin:12px 0}
.pindots i{width:20px;height:20px;border-radius:50%;border:3px solid var(--green)}
.pindots i.on{background:var(--green)}
.pindots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:340px;margin:0 auto}
.pinpad button{height:76px;border-radius:18px;background:#efe7d6;font-size:30px;font-weight:700}
.pinpad .pk-s{font-size:18px}
#toast{position:fixed;left:50%;top:calc(80px + var(--sat));transform:translateX(-50%) translateY(-30px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:14px 22px;border-radius:16px;z-index:80;font-weight:600;transition:transform .25s,opacity .25s;max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast:not(.show){visibility:hidden;transition:transform .25s,visibility 0s .25s}
.tiles.one{grid-template-columns:1fr!important}
.tiles.one .tile{min-height:260px}

/* ---------- full-height panels (payment) and the exit screen ---------- */
.bigscrim{padding:calc(10px + var(--sat)) 10px calc(10px + var(--sab))}
.modal.big{width:min(640px,100%);height:100%;max-height:100%;display:flex;flex-direction:column;padding:20px}
.modal.big .pbody{flex:1;overflow:auto;margin:0 -4px;padding:0 4px}
.modal.big .pfoot{padding-top:12px;border-top:2px solid var(--line);margin-top:8px}

.approved{position:fixed;inset:0;z-index:90;background:var(--ok);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
.approved .tick{font-size:110px;line-height:1}
.approved h1{font-size:40px;margin:10px 0;font-family:var(--brand-font)}
.approved p{font-size:22px;margin:6px 0}
.approved .btn{background:#fff;color:var(--ok);margin-top:26px;min-width:240px;min-height:64px;font-size:20px}
.approved .mailbtn{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.8);margin-top:12px}
#exitScr{position:fixed;inset:0;z-index:95;background:linear-gradient(170deg,#ebe7da 0%,#f7f5ee 55%,#e4e6d6 100%);display:flex;align-items:center;justify-content:center;padding:24px}
.exitcard{background:var(--card);border-radius:28px;padding:34px 28px;width:min(480px,100%);text-align:center;box-shadow:0 20px 60px rgba(47,59,31,.16)}
.exitcard .brandlogo{max-width:100%;max-height:150px;mix-blend-mode:multiply}
.exitcard .exiticon{width:120px;height:120px;border-radius:26px}
.exitcard h1{font-family:var(--brand-font);color:var(--green);margin:14px 0 2px;font-size:32px}
.exitsub{color:var(--green2);font-family:var(--brand-font);letter-spacing:.08em;margin:0 0 22px}

/* ---------- install card ---------- */
.inst{position:fixed;left:calc(16px + var(--sal));right:calc(16px + var(--sar));bottom:calc(16px + var(--sab));z-index:40;background:#fff;border:2px solid var(--green2);border-radius:22px;padding:16px 18px;display:flex;gap:14px;align-items:center;box-shadow:0 10px 40px rgba(0,0,0,.18);max-width:640px;margin:0 auto}
.inst img{width:60px;height:60px;border-radius:14px}
.inst .t{flex:1} .inst .t b{display:block;font-size:19px} .inst .t span{display:block;color:var(--muted);font-size:16px}
.inst .how{color:var(--ink)!important;margin-top:4px}
.shareic{display:inline-block;vertical-align:-4px;width:22px;height:22px}

/* ---------- sign-in gate ---------- */
#gate{position:fixed;inset:0;z-index:60;background:linear-gradient(170deg,#ebe7da 0%,#f7f5ee 55%,#e4e6d6 100%);display:flex;align-items:center;justify-content:center;padding:calc(20px + var(--sat)) 20px calc(20px + var(--sab));overflow:auto}
.gcard{background:var(--card);border-radius:28px;padding:34px 30px;width:min(520px,100%);text-align:center;box-shadow:0 20px 60px rgba(47,59,31,.16)}
.gcard img.logo{width:96px;height:96px;border-radius:24px}
.gcard h1{margin:14px 0 6px;font-size:32px;color:var(--green)}
.gcard p{margin:10px 0}
.gbtn{display:inline-flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 26px;font-weight:700;font-size:20px;min-height:64px;margin-top:14px}

.gbtn.dark{background:var(--green);color:#fff;border-color:var(--green)}
.gsmall{font-size:15px;color:var(--muted)}
.gerr{background:#fbe4e1;color:#7d1d16;border-radius:14px;padding:12px 14px;font-size:16px;text-align:left;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.gdots{display:flex;gap:10px;justify-content:center;margin:18px 0}
.gdots i{width:14px;height:14px;border-radius:50%;background:var(--green2);animation:bob 1s infinite}
.gdots i:nth-child(2){animation-delay:.15s;background:var(--green)} .gdots i:nth-child(3){animation-delay:.3s;background:var(--lav)}

/* ---------- iPad portrait and phones ---------- */
@media (max-width:1000px) and (orientation:portrait),(max-width:860px){ .tiles{grid-template-columns:repeat(2,1fr)} }
.tiles.one .tile.sell,.tiles.two .tile.sell{grid-column:auto}
.tiles.two{grid-template-columns:1fr 1fr}
@media (max-width:640px){
  .tiles{gap:12px} .tile{min-height:150px;padding:16px;border-radius:22px} .tile .ic{font-size:40px} .tile h2{font-size:23px} .tile p{font-size:15px}
  .today{grid-template-columns:repeat(2,1fr);padding:14px 16px} .today div b{font-size:23px}
  .top .title h1{font-size:20px} .syncpill{font-size:13px;padding:6px 10px} .top .back{font-size:17px;padding:8px 14px 8px 10px}
  main{padding-left:calc(12px + var(--sal));padding-right:calc(12px + var(--sar))}
}
</style>

<body>
<header class="top" id="top"></header>
<main id="main"></main>
<div id="layer"></div>
<div id="toast"></div>
<div id="gate"></div>
<div id="exitScr" hidden></div>

<script>/*@SYNC@*/</script>
<script>
'use strict';
/* ================= basics ================= */
const CONFIG=/*@CONFIG@*/null;
const APP_VERSION='/*@VERSION@*/';
const TZ='Pacific/Auckland';                       // one home time zone, whatever the device is set to
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsGet=(k,d)=>{ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } };
const lsSet=(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };
const money=n=>'$'+(Math.round((+n||0)*100)/100).toLocaleString('en-NZ',{minimumFractionDigits:2,maximumFractionDigits:2});
const nzDate=(d,o)=>new Intl.DateTimeFormat('en-NZ',Object.assign({timeZone:TZ},o||{weekday:'long',day:'numeric',month:'long'})).format(d);
const isIOS=()=>/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isStandalone=()=>navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
const isEmail=s=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(s||'').trim());
let toastT=null;

let modalStack=[];
// opts.big: a full-height panel (payment); opts.sticky: tapping outside doesn't close it.
// A pop-up with several steps sets close.onBack; the back button then goes back one step (returns true)
// instead of closing the whole pop-up.
function modal(build,opts){
  opts=opts||{};
  const L=$('#layer'); const scrim=document.createElement('div'); scrim.className='scrim'+(opts.big?' bigscrim':'');
  const m=document.createElement('div'); m.className='modal'+(opts.big?' big':''); scrim.appendChild(m); L.appendChild(scrim);
  const close=()=>{ scrim.remove(); modalStack=modalStack.filter(x=>x!==close); };
  modalStack.push(close);
  scrim.addEventListener('click',e=>{ if(e.target===scrim&&!opts.sticky) close(); });
  build(m,close);
  return close;
}
const closeModal=()=>{ const c=modalStack[modalStack.length-1]; if(!c) return; if(c.onBack&&c.onBack()) return; c(); };
function confirmBox(title,body,yes,onYes,danger){
  modal((m,close)=>{ m.innerHTML=`<h2>${esc(title)}</h2><p>${body}</p><div class="mact"><button class="btn alt" id="cN">Cancel</button><button class="btn ${danger?'danger':''}" id="cY">${esc(yes)}</button></div>`;
    m.querySelector('#cN').onclick=close; m.querySelector('#cY').onclick=()=>{ close(); onYes(); }; });
}

// Every screen has a visible Back button: the iPad has no system back button.
const SCREENS={};
let stack=['home'];
const cur=()=>stack[stack.length-1];
function go(name){ if(cur()===name||tillLock()) return; stack.push(name); render(); window.scrollTo(0,0); }
function back(){ if(tillLock()) return true; if(stack.length>1){ const left=stack.pop(); if(left==='setup') relockPin(); render(); window.scrollTo(0,0); return true; } return false; }
function home(){ if(stack.includes('setup')) relockPin(); stack=['home']; render(); }

let pendingWrites=false;
function drawSync(){
  const p=$('#syncPill'); if(!p) return;

  else { p.className='syncpill'; p.textContent='✓ Saved'; }
}

const LATEST_HELPER=7;   // helper/Code.gs HELPER_VERSION
function helperStatus(){
  const h=S.receiptHelper, st=S.settings;
  if(!st.gstNumber||!st.receiptEmail) return 'Add the GST number and the business Gmail above, then set up the helper (see the setup steps).';
  if(!h||!h.lastRun) return 'Not running yet: receipts will wait until the helper is set up in '+esc(st.receiptEmail)+'.';
  const mins=Math.round((Date.now()-h.lastRun)/60e3), ago=mins<1?'just now':mins<120?mins+' min ago':Math.round(mins/60)+' hours ago';
  if(h.account&&h.account!==st.receiptEmail) return '⚠️ The helper runs in '+esc(h.account)+', not '+esc(st.receiptEmail)+'. Receipts won\'t send until they match.';
  if(h.error) return '⚠️ Last check '+ago+': '+esc(h.error);
  if((h.version||0)<LATEST_HELPER) return '⚠️ Last checked '+ago+'. A newer helper is available (version '+LATEST_HELPER+'): paste the latest helper Code.gs into the script in '+esc(st.receiptEmail)+' and save.';
  return (mins>20?'⚠️ ':'✓ ')+'Last checked '+ago+(h.sent?' · '+h.sent+' receipt'+(h.sent===1?'':'s')+' sent in total':'')+(mins>20?'. It should check every 5 minutes; see the setup steps.':'');
}

/*@MODULES@*/

/* ================= Personal PINs and approvals =================
   Each owner and manager has their own PIN, kept as a salted hash in pins/{email}, which helpers can't read.
   approve() asks for a PIN, works out whose it is, writes a line to the approvals log (who, what, when),
   then carries on. Setup locks again the moment it closes (lesson from Family Screen). */
let pinFails=0, pinWaitUntil=0, setupOpen=false, moneyUntil=0;
const relockPin=()=>{ setupOpen=false; };
const myPin=()=>S.pins.find(p=>p.id===SYNC.me()&&p.hash);
const anyPins=()=>S.pins.some(p=>p.hash);
const personName=e=>{ const p=S.pins.find(x=>x.id===e); return (p&&p.name)||String(e||'?').split('@')[0]; };
async function pinHashOf(pin,email){ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode((SYNC.businessId()||'')+'|'+email+'|rata-smudge|'+pin)); return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join(''); }
async function whosePin(pin){ for(const p of S.pins){ if(p.hash&&await pinHashOf(pin,p.id)===p.hash) return p.id; } return null; }
// The approvals log is about workers: something a manager or helper needed, signed off with a PIN.
// An owner working on their own (not in till mode) is not logged: opening Setup, seeing the takings and
// so on are an owner's own business. (Sales, voids, discounts and floats still record who approved them
// on the record itself, whoever did it.)
// Everyday checks that aren't worth a record when an owner does them (a manager's still are, for record keeping).
// The day's cash count is kept on the selling day itself either way.
const QUIET_ACTIONS=['see the takings','see the sales','open Setup','leave till mode','end the day','close the day'];
const quietEntry=a=>QUIET_ACTIONS.includes(a.action)&&!!a.approver&&SYNC.getOwners().includes(a.approver);
function logApproval(action,approver,details,always){
  if(!always&&!tillLock()&&role()==='owner') return;   // an owner on their own device isn't logged, except a sale that goes ahead with an override
  if(!always&&quietEntry({action,approver})) return;
  S.audit.push({id:SYNC.newId('audit'),at:Date.now(),day:nzDay(),action,approver:approver||null,approverName:approver?personName(approver):'',by:SYNC.me(),tillMode:!!tillLock(),details:String(details||'')});
  save();
}
// approve('give a discount', who=>{...}, 'details for the log')
function approve(action,fn,details){
  if(role()==='helper'){ toast('Ask an owner to do this on their own device or the main iPad.'); return; }   // helper accounts can't read PINs
  if(!anyPins()){
    if(tillLock()){ toast('No PINs are set up yet. Ask the owner.'); return; }
    confirmBox('Set your PIN first','Approvals need a personal PIN. Choose yours now; each owner and manager has their own.','Choose my PIN',()=>setPinFlow(()=>approve(action,fn,details))); return;
  }
  // every owner and manager has their own PIN: someone signed in without one sets theirs first
  // (in till mode the iPad is in a helper's hands, so whoever comes to approve uses their own PIN)
  if(canManage()&&!tillLock()&&!myPin()){
    confirmBox('Set your own PIN first',esc(SYNC.me())+' hasn\'t got a PIN yet. Every owner and manager has their own, so the log shows who approved what. Choose yours now.','Choose my PIN',()=>setPinFlow(()=>approve(action,fn,details))); return;
  }
  let who=null;
  pinPad('PIN to '+action,async pin=>{ who=await whosePin(pin); if(who){ pinFails=0; return true; } if(++pinFails>=3){ pinWaitUntil=Date.now()+30e3; pinFails=0; } return false; },
    ()=>{ logApproval(action,who,typeof details==='function'?details():details); fn(who); },!tillLock()&&canManage());
}
function requirePin(fn){ if(setupOpen){ fn(); return; } approve('open Setup',()=>{ setupOpen=true; fn(); }); }
function pinPad(title,check,onOk,canForget){
  modal((m,close)=>{ let val='';
    const draw=()=>{ const wait=Math.max(0,Math.ceil((pinWaitUntil-Date.now())/1000));
      m.innerHTML=`<h2 style="text-align:center">🔒 ${esc(title)}</h2><div class="pindots">${[0,1,2,3].map(i=>`<i class="${i<val.length?'on':''}"></i>`).join('')}</div>
        <p class="note" id="pinMsg" style="text-align:center;min-height:24px">${wait?`Too many tries. Wait ${wait} seconds.`:''}</p>
        <div class="pinpad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}<button data-k="x" class="pk-s">Cancel</button><button data-k="0">0</button><button data-k="b" class="pk-s" aria-label="Delete">⌫</button></div>
        ${canForget?'<p style="text-align:center;margin:14px 0 0"><button class="btn alt small" id="pinForgot">Forgot my PIN</button></p>':''}`;
      m.querySelectorAll('[data-k]').forEach(b=>b.onclick=async()=>{ const k=b.dataset.k;
        if(k==='x'){ close(); return; } if(Date.now()<pinWaitUntil){ draw(); return; }
        if(k==='b'){ val=val.slice(0,-1); draw(); return; }
        if(val.length<4) val+=k; draw();
        if(val.length===4){ const ok=await check(val); if(ok===true){ close(); onOk&&onOk(val); } else { val=''; draw(); const msg=m.querySelector('#pinMsg'); if(msg&&!msg.textContent) msg.textContent=typeof ok==='string'?ok:'That PIN isn\'t right'; m.querySelector('.pindots').classList.add('shake'); } } });
      const f=m.querySelector('#pinForgot'); if(f) f.onclick=()=>{ close(); confirmBox('Reset your PIN?','This resets the PIN of <b>'+esc(SYNC.me())+'</b> (the account signed in on this device). You\'ll be signed out; sign back in with that Google account within 10 minutes and your old PIN is removed, so you can set a new one.','Sign out and reset',()=>{ lsSet('rs.pinReset',Date.now()); SYNC.signOut(); }); };
    };
    draw(); m.tabIndex=-1; m.focus();
    m.onkeydown=e=>{ if(/^[0-9]$/.test(e.key)) m.querySelector(`[data-k="${e.key}"]`).click(); if(e.key==='Backspace') m.querySelector('[data-k="b"]').click(); };
  });
}
// Set or change the signed-in owner's or manager's own PIN. PINs must differ between people,
// so a PIN always identifies exactly one person in the approvals log.
function setPinFlow(after){
  if(!canManage()){ toast('Only owners and managers have PINs'); return; }
  modal((m,close)=>{ m.innerHTML=`<h2>Your PIN</h2><p class="note">Your name as it should appear in the approvals log:</p><input class="txt" id="pnN" autocapitalize="words" value="${esc(myPin()&&myPin().name||'')}" placeholder="e.g. Fiona">
    <div class="mact"><button class="btn alt" id="pnC">Cancel</button><button class="btn" id="pnOk">Next</button></div>`;
    m.querySelector('#pnC').onclick=close;
    m.querySelector('#pnOk').onclick=()=>{ const name=m.querySelector('#pnN').value.trim(); if(!name){ toast('Type your name'); return; } close();
      let first='';
      pinPad('Choose a 4-digit PIN',async pin=>{ for(const p of S.pins){ if(p.id!==SYNC.me()&&p.hash&&await pinHashOf(pin,p.id)===p.hash) return 'Someone else uses that PIN. Choose another.'; }
          if(/^(\d)\1{3}$/.test(pin)||pin==='1234'||pin==='4321') return 'Too easy to guess. Choose another.'; first=pin; return true; },()=>{
        pinPad('Type it again',async pin=>pin===first,async pin=>{
          const rec={id:SYNC.me(),name,hash:await pinHashOf(pin,SYNC.me()),set:Date.now()};
          const ex=S.pins.find(p=>p.id===SYNC.me()); if(ex) Object.assign(ex,rec); else S.pins.push(rec);
          logApproval(ex?'change own PIN':'set own PIN',SYNC.me(),''); save(); toast('Your PIN is set'); after&&after(); },false);
      },false); };
    setTimeout(()=>m.querySelector('#pnN').focus(),50); });
}
// forgot-PIN: the person signed out and back in with Google, which proves it's them; their PIN is removed
function checkPinReset(){
  const at=lsGet('rs.pinReset',0); if(!at) return;
  if(Date.now()-at>10*60e3){ lsSet('rs.pinReset',0); return; }
  if(canManage()&&SYNC.lastSignIn()>at-5000){ lsSet('rs.pinReset',0); const i=S.pins.findIndex(p=>p.id===SYNC.me()); if(i>=0){ S.pins.splice(i,1); logApproval('reset own PIN (signed in again)',null,''); } save(); toast('Your PIN was removed. Set a new one in Setup.'); }
}

/* ================= Android back button =================
   Back closes the pop-up, then the screen, then shows the Rata & Smudge screen; only then can the app close.
   How it works: we keep one extra history entry (a "guard") above the page, so the back button lands on
   our page instead of leaving the app. Chrome on Android SKIPS any history entry that was added while the
   screen hadn't just been touched (its protection against apps trapping the back button). So a guard
   added at start-up or straight after a back press can be skipped, and the app closes: that was the bug.
   Fix: a guard only counts once it was added during a touch. Until then, the very next touch or key
   press adds a fresh one (an extra history entry is harmless; a skipped one is not). */
let guardTrusted=false, quitAsk=false;
function reguard(){
  // added inside a touch or key press? (navigator.userActivation where available; otherwise we're told)
  const active=arguments[0]===true||!!(navigator.userActivation&&navigator.userActivation.isActive);
  if(history.state&&history.state.rs==='guard'&&(guardTrusted||!active)) return;
  history.pushState({rs:'guard',t:Date.now()},''); guardTrusted=active;
}
history.replaceState({rs:'base'},''); reguard();
['pointerdown','keydown','touchstart'].forEach(t=>document.addEventListener(t,()=>{ if(!quitAsk&&!guardTrusted) reguard(true); },{capture:true,passive:true}));
addEventListener('popstate',()=>{
  guardTrusted=false;   // the guard we were on is gone; whatever we add now (no touch) may be skipped
  if(quitAsk){ quitAsk=false; $('#exitScr').hidden=true; history.back(); return; }
  if(modalStack.length){ closeModal(); reguard(); return; }
  if(typeof sheetOpen!=='undefined'&&sheetOpen&&cur()==='sell'){ setSheet(false); reguard(); return; }   // open sale panel: close it first
  if(typeof calBack==='function'&&calBack()){ reguard(); return; }
  if(back()){ reguard(); return; }
  if(!$('#gate').hidden){ history.back(); return; }
  showExit();
});
// At the home screen, back shows a full Rata & Smudge screen instead of closing the app straight away.
// Only a second back (or "Close the app") leaves.
function showExit(){
  quitAsk=true; const e=$('#exitScr');
  e.innerHTML=`<div class="exitcard"><img class="brandlogo" src="brand-logo.webp" alt="Rata &amp; Smudge" onerror="this.src='icon-512.png';this.className='exiticon'">
    <h1>Rata &amp; Smudge</h1><p class="exitsub">Till · Brew · Orders</p>
    <button class="btn bigbtn" id="exStay">Stay in the app</button>
    <p class="note">Press <b>back</b> again to close the app.</p></div>`;
  e.hidden=false;
  $('#exStay').onclick=()=>{ quitAsk=false; e.hidden=true; reguard(true); };
}

/* ================= stay up to date ================= */
// Checks version.json every 5 minutes and reloads itself, but never while a pop-up or form is open.
let updateReady=false;
async function checkUpdate(){
  if(location.protocol!=='https:') return;
  try{ const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'}); const v=(await r.json()).version; if(v&&v!==APP_VERSION){ updateReady=true; applyUpdate(); } }catch(e){}
}
function applyUpdate(){
  if(!updateReady) return;
  const busy=modalStack.length||(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))||cur()==='sell';
  if(busy){ setTimeout(applyUpdate,30000); return; }
  location.reload();
}
setInterval(checkUpdate,5*60e3); setTimeout(checkUpdate,20e3);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') checkUpdate(); });
setInterval(()=>{ if(cur()==='home'&&!modalStack.length) render(); },60e3);   // keeps the date right after midnight

/* ================= boot ================= */
if(!CONFIG){ gate('noconfig'); }
else {
  gate('loading');
  SYNC.init(CONFIG,{emulator:/[?&]emulator/.test(location.search)});
  SYNC.watchAuth(async u=>{ if(!u){ SYNC.stop(); await SYNC.afterRedirect(); if(SYNC.me()) return; const e=SYNC.takeRedirectError(); gate('signin',e?'Sign-in did not finish: '+errText(e):''); } else enterBusiness(); });
  window.__test={ S, SYNC, go, home, back };
}
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
