# Checks the security rules against Firebase's own Firestore emulator on every change to them.
name: Test security rules
on:
  push:
    paths: [firestore.rules, test/rules.test.js, .github/workflows/test-rules.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx firebase emulators:exec --only firestore --project demo-rules-test "node test/rules.test.js"
