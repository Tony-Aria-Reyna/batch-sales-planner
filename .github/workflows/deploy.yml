# Builds the app and publishes it to https://batch-sales-planner.web.app on every push to main.
# Needs one repository secret, FIREBASE_SERVICE_ACCOUNT (the JSON key from Firebase →
# Project settings → Service accounts → Generate new private key). Never commit that key.
name: Deploy to Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Fetch the logo from rataandsmudge.co.nz
        run: |
          pip install --quiet pillow
          python3 scripts/fetch-logo.py src/brand-logo.webp || echo "::warning::Logo not fetched; the app will show its icon instead"
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: batch-sales-planner
          channelId: live
