# Runs when this file changes on the dev branch (edit the "run" line below to take a new logo): takes Rata & Smudge's logo from rataandsmudge.co.nz
# (run 1) once and commits it to the dev branch, so the app's branding stays fixed even if the website changes.
name: Lock the logo
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths: ['.github/workflows/lock-logo.yml']
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - run: pip install --quiet pillow && python3 scripts/fetch-logo.py src/brand-logo.webp
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add src/brand-logo.webp src/brand-logo.png
          git commit -m "Lock the Rata & Smudge logo (from rataandsmudge.co.nz)" || echo "no change"
          git push origin dev
